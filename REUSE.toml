version = 1

# OpenAccountants is a mixed-licence repository. See LICENSING.md for the plain
# explanation. This file records, per REUSE (https://reuse.software), which
# licence applies to which files so tooling and downstream users can resolve it
# without editing every file.
#
# Precedence note: when a file matches more than one [[annotations]] block, the
# LAST matching block wins. The default below is applied to everything, then the
# Guide-content block overrides it for the Guides and their exports.

# --- Default: software, tooling, docs, and project metadata → AGPL-3.0-only ---
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Glimpse Ltd"
SPDX-License-Identifier = "AGPL-3.0-only"

# --- Tax Guides and their machine-readable exports → OA Guide License ---
# Source-available; commercial embedding / RAG / model-training / bulk
# redistribution require a commercial licence. See
# LICENSES/LicenseRef-OA-Guide-License-2.0.txt.
#
# CAVEAT (counsel to resolve): some Guides under packages/ incorporate
# third-party AGPL-3.0 / GPL-3.0 material and may NOT be validly relicensed
# here — they remain under their original copyleft terms until audited. See
# LICENSING.md § "Known compatibility caveat".
[[annotations]]
path = [
  "skills/**",
  "evidence/research/**",
  "packages/**",
  "workflows/**",
  "agent-skills/**/SKILL.md",
  "agent-skills/index.json",
  "plugins/openaccountants/skills/**",
  "calculators/**/rules.json",
  "index.json",
  "llms.txt",
  "llms-full.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Glimpse Ltd and Open Accountants contributors"
SPDX-License-Identifier = "LicenseRef-OA-Guide-License-2.0"

# Exact statutory API data and generated readers retain their source licence.
[[annotations]]
path = "evidence/ledgers/svalbard-beneficial-owners-20261031/api-sources/**"
precedence = "override"
SPDX-FileCopyrightText = "Stiftelsen Lovdata; source Norwegian legislative authorities"
SPDX-License-Identifier = "NLOD-2.0"
