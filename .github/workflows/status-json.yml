name: Publish status.json

# One file the admin control room reads: per jurisdiction, skills, at the 2026 standard,
# approved, missing tax areas, owner. Published to the status-data branch (one commit,
# overwritten each run) so the site can read it without a token and without a commit to
# main every day. Releases in this repo are immutable, so a release asset cannot be replaced.
on:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths: ["skills/**", "scripts/data/jurisdictions.json", "scripts/coverage-report.py"]
  workflow_dispatch:

concurrency:
  group: status-json
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the status-data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Build status.json
        run: python3 scripts/coverage-report.py --json > status.json
      - name: Publish to the status-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One commit, no history: the branch holds only today's file.
          mkdir out && cp status.json out/ && cd out
          git init -q -b status-data
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            add status.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "status.json $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" +status-data:status-data
