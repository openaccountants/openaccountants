# Deliver and verify every human-edited skill after merge, with one author per
# batch and at most200 paths. Manual recovery uses the same checked path.
name: Ingest to platform

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:
    inputs:
      since_sha:
        description: "Last commit whose skills reached the platform"
        required: true

permissions:
  contents: read

jobs:
  ring:
    # Keep ingestion secrets restricted to the protected production environment.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deliver and verify every human-edited skill
        env:
          PLATFORM_INGEST_SECRET: ${{ secrets.PLATFORM_INGEST_SECRET }}
          SINCE_SHA: ${{ github.event.before || inputs.since_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/deliver-to-platform.py --since "$SINCE_SHA" --head "$HEAD_SHA" --send
