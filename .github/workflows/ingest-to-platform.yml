# Deliver and verify every human-edited skill after merge, with one author per
# batch. Pushes, scheduled catch-up and manual recovery use the same checked path.
name: Ingest to platform

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:
    inputs:
      since_sha:
        description: "Last commit whose skills reached the platform"
        required: true
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  issues: write # only the persistent delivery work list; source remains read-only

# Keep pending events instead of replacing earlier pushes. Read main only after
# this lock is acquired: an older queued event must not replay an older head.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
concurrency:
  group: platform-skill-delivery
  queue: max

jobs:
  ring:
    # Keep ingestion secrets restricted to the protected production environment.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Deliver and verify every human-edited skill
        env:
          PLATFORM_INGEST_SECRET: ${{ secrets.PLATFORM_INGEST_SECRET }}
          SINCE_SHA: ${{ github.event.before || inputs.since_sha }}
          DELIVERY_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          DELIVERY_WORK_LIST_ISSUE: "1506"
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${DELIVERY_EVENT:-}" = "schedule" ]; then
            python3 scripts/deliver-to-platform.py --lookback-days 7 --head "$HEAD_SHA" --batch-size 20 --work-list --send
          else
            python3 scripts/deliver-to-platform.py --since "$SINCE_SHA" --head "$HEAD_SHA" --batch-size 20 --work-list --send
          fi
