# Owner scope: some owners may merge only inside their own folders.
#
# 1. Required check "owner-scope": a pull request opened by a scoped owner that changes files
#    outside their folders fails until the approver approves that exact version.
# 2. Watcher: if a scoped owner merges a pull request that changes files outside their folders,
#    an issue is opened for the approver.
#
# Owners are listed by the SHA-256 of their GitHub login. pull_request_target reads this file
# from main, so a pull request cannot change the rule that judges it; nothing from the pull
# request is checked out or run.
name: owner-scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: owner-scope-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' }}
  cancel-in-progress: true

env:
  SCOPED_OWNER_SHA256: 413d03f39cd906d6d6f0b90a341751445d1057d58efb09f71854bad0100ee413
  ALLOWED: '^(skills/australia/|packages/australia/|agent-skills/[^/]*australia[^/]*/|calculators/au-[^/]+/)'
  APPROVER: michaelcutajar1995

jobs:
  owner-scope:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check the files against the owner's folders
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$(printf '%s' "$AUTHOR" | sha256sum | cut -c1-64)" != "$SCOPED_OWNER_SHA256" ]; then
            echo "Not a scoped pull request: nothing to check."; exit 0
          fi
          outside=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename' | grep -Ev "$ALLOWED" || true)
          if [ -z "$outside" ]; then
            echo "Every file is inside the owner's folders."; exit 0
          fi
          approved=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            -q "[.[] | select(.user.login == \"$APPROVER\" and .commit_id == \"$HEAD\")] | last | .state // \"\"")
          if [ "$approved" = "APPROVED" ]; then
            echo "Files outside the owner's folders, approved on this version."; exit 0
          fi
          echo "::error::These files are outside the owner's folders and need approval:"
          echo "$outside"
          exit 1

  watch-merge:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Tell the approver if a scoped owner merged outside their folders
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          merger=$(gh api "repos/$REPO/pulls/$PR" -q '.merged_by.login')
          [ "$(printf '%s' "$merger" | sha256sum | cut -c1-64)" = "$SCOPED_OWNER_SHA256" ] || { echo "Nothing to check."; exit 0; }
          outside=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename' | grep -Ev "$ALLOWED" || true)
          [ -n "$outside" ] || { echo "Inside the owner's folders."; exit 0; }
          body=$(printf '#%s changed files outside the merging owner'"'"'s folders:\n\n```\n%s\n```' "$PR" "$(echo "$outside" | head -50)")
          gh issue create -R "$REPO" --title "Owner scope: #$PR merged outside its folders" --assignee "$APPROVER" --body "$body"
