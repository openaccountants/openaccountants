name: MCP package

on:
  pull_request:
    paths:
      - "mcp/**"
      - "packages/**"
      - ".github/workflows/mcp-package.yml"
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "packages/**"
      - ".github/workflows/mcp-package.yml"

permissions:
  contents: read

jobs:
  build-install-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0"
          python -m build mcp --outdir dist
          python -m pip install -r scripts/requirements-validation.txt
          python scripts/probe-installed-publication.py --write-expected dist/publication-expectations.json
      - name: Install and exercise the wheel outside the checkout
        run: |
          TEST_ROOT="$(mktemp -d)"
          python -m venv "$TEST_ROOT/venv"
          "$TEST_ROOT/venv/bin/pip" install dist/*.whl
          cd "$TEST_ROOT"
          "$TEST_ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/probe-installed-publication.py" \
            --check "$GITHUB_WORKSPACE/dist/publication-expectations.json"
          "$TEST_ROOT/venv/bin/python" "$GITHUB_WORKSPACE/mcp/tests/test_publication_holds.py"
          "$TEST_ROOT/venv/bin/python" "$GITHUB_WORKSPACE/mcp/tests/test_startup_method.py"
          "$TEST_ROOT/venv/bin/python" - <<'PY'
          from openaccountants_mcp import server

          result = server.list_skills()
          assert result["total"] > 300, result
          assert server.PACKAGES_DIR.is_relative_to(server._MODULE_DIR), server.PACKAGES_DIR
          print(f"installed wheel exposes {result['total']} bundled skills")
          PY
