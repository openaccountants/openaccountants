name: Weekly coverage report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # create the pinned issue and comment the report on it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Build the report
        run: python3 scripts/coverage-report.py --markdown > report.md
      - name: Post it on the pinned issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --search '"Weekly coverage report" in:title' --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create -R "$GITHUB_REPOSITORY" --title "Weekly coverage report" --label coverage --body "Posted every Monday by .github/workflows/coverage-report.yml. Latest report is the last comment." | grep -o '[0-9]*$')
          fi
          gh issue comment -R "$GITHUB_REPOSITORY" "$n" --body-file report.md
