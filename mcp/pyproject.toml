[project]
name = "openaccountants-mcp"
version = "0.3.0"
description = "MCP server giving AI assistants on-demand access to open-source accounting skills across 134 countries, 51 US states, and 13 Canadian provinces/territories — tax, bookkeeping, payroll, e-invoicing, formation, cross-border (Pillar Two, CBAM, FATCA/CRS, DST), and sector verticals."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
# mcp is capped below 2.0: 2.x removes `mcp.server.fastmcp`, which server.py
# imports, so the server cannot start. Lift the cap only with a reviewed
# migration to the 2.x HTTP stack.
dependencies = ["mcp>=1.0.0,<2", "pyyaml>=6.0"]
keywords = [
    "tax", "accounting", "mcp", "ai", "accountant", "vat", "gst",
    "income-tax", "open-source", "self-employed", "freelancer",
    "claude", "chatgpt", "llm", "tax-computation", "bookkeeping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://openaccountants.com"
Repository = "https://github.com/openaccountants/openaccountants"
Issues = "https://github.com/openaccountants/openaccountants/issues"
Documentation = "https://github.com/openaccountants/openaccountants/tree/main/mcp"

[project.scripts]
openaccountants-mcp = "openaccountants_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
